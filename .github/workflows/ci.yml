name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t coaching-faq-bot .
      - name: Start the container and check it serves the API and the app
        run: |
          docker run -d --name faqbot -p 8000:8000 -e SECRET_KEY=ci-only-secret coaching-faq-bot
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/centres/1)" = "404"
          test "$(docker exec faqbot id -un)" = "app"
      - if: always()
        run: docker logs faqbot || true
